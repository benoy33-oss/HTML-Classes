<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <div>
        <h1>Counter App</h1>
        <p id="timer">0</p>
        <button id="increase" onclick="increase()">Increase</button>
        <button id="decrease" onclick="decrease()">Decrease</button>
        <button id="reset" onclick="reset()">Reset</button>
        </div>
        <script>
            var counter = 0
            var button_increase = document.getElementById("increase");
            var button_decrease = document.getElementById("decrease");
            var button_reset = document.getElementById("reset")
            function increase() {
                 counter = counter + 1
                 document.getElementById("timer").innerHTML = counter;
            }
            function decrease() {
                counter = counter - 1
                document.getElementById("timer").innerHTML = counter;
            }
            function reset() {
                counter = 0
                document.getElementById("timer").innerHTML = counter;
            }
        </script>
    </body>
</html>
